<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ABCコースター — もじのかたちをのりこなせ!</title>
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- タイトル画面 -->
  <div id="title">
    <div id="title-letters"></div>
    <div id="title-name">コースター</div>
    <div id="title-sub">もじのかたちを のりこなせ!</div>
    <div id="title-buttons">
      <button class="mode-btn" id="play-coaster">
        <span class="icon">🎢</span>
        <span class="label-en">COASTER</span>
        <span class="label-ja">もじのレールにのる</span>
      </button>
      <button class="mode-btn" id="play-balloon">
        <span class="icon">🎈</span>
        <span class="label-en">BALLOON</span>
        <span class="label-ja">とぶ? もれる?</span>
      </button>
      <button class="mode-btn" id="play-circus">
        <span class="icon">🎪</span>
        <span class="label-en">FLIP</span>
        <span class="label-ja">さかさまサーカス</span>
      </button>
    </div>
  </div>

  <!-- 遊び中のUI (各モードが中身を作る) -->
  <div id="hud"></div>

  <button id="btn-home" class="hidden">🏠</button>

  <script src="js/tracks.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/coaster.js"></script>
  <script src="js/balloon.js"></script>
  <script src="js/circus.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
