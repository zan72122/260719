<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>スケスケなかみランド</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="home" class="screen">
  <h1 id="title">
    <span>ス</span><span>ケ</span><span>ス</span><span>ケ</span><span>な</span><span>か</span><span>み</span><span>ラ</span><span>ン</span><span>ド</span>
  </h1>
  <div class="cards">
    <button class="card" data-game="pen">
      <span class="thumb" style="background-image:url('assets/thumb-pen.jpg')"></span>
      <span class="label">ぺん</span>
    </button>
    <button class="card" data-game="pump">
      <span class="thumb" style="background-image:url('assets/thumb-pump.jpg')"></span>
      <span class="label">ぽんぷ</span>
    </button>
    <button class="card" data-game="umbrella">
      <span class="thumb" style="background-image:url('assets/thumb-umbrella.jpg')"></span>
      <span class="label">かさ</span>
    </button>
    <button class="card" data-game="dryer">
      <span class="thumb" style="background-image:url('assets/thumb-dryer.jpg')"></span>
      <span class="label">どらいやー</span>
    </button>
    <button class="card" data-game="hanabi">
      <span class="thumb" style="background-image:url('assets/thumb-hanabi.jpg')"></span>
      <span class="label">はなび</span>
    </button>
    <button class="card" data-game="rocket">
      <span class="thumb" style="background-image:url('assets/thumb-rocket.jpg')"></span>
      <span class="label">ろけっと</span>
    </button>
    <button class="card" data-game="locomotive">
      <span class="thumb" style="background-image:url('assets/thumb-locomotive.jpg')"></span>
      <span class="label">きかんしゃ</span>
    </button>
    <button class="card" data-game="extinguisher">
      <span class="thumb" style="background-image:url('assets/thumb-extinguisher.jpg')"></span>
      <span class="label">しょうかき</span>
    </button>
    <button class="card" data-game="carwash">
      <span class="thumb" style="background-image:url('assets/thumb-carwash.jpg')"></span>
      <span class="label">せんしゃき</span>
    </button>
  </div>
</div>

<div id="game" class="screen hidden">
  <button id="homeBtn" aria-label="ホームへもどる">🏠</button>
  <div id="stage"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script src="js/util.js"></script>
<script src="js/g3.js"></script>
<script src="js/sound.js"></script>
<script src="js/pen.js"></script>
<script src="js/pump.js"></script>
<script src="js/umbrella.js"></script>
<script src="js/dryer.js"></script>
<script src="js/hanabi.js"></script>
<script src="js/rocket.js"></script>
<script src="js/locomotive.js"></script>
<script src="js/extinguisher.js"></script>
<script src="js/carwash.js"></script>
<script src="js/main.js"></script>
</body>
</html>
